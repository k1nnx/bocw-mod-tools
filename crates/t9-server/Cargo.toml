[package]
name = "t9-server"
version = "0.1.0"
edition = "2021"
description = "T9 (BOCW) DemonWare emulator server"

[[bin]]
name = "t9-server"
path = "src/main.rs"

[dependencies]
t9-common = { path = "../t9-common" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2"
