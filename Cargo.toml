[workspace]
members = [
    "crates/t9-common",
    "crates/t9-server",
    "crates/t9-proxy",
]

[package]
name = "bocw_mod_tools"
version = "0.1.0"
edition = "2021"
default-run = "bocw_mod_tools"
description = "Black Ops Cold War zone file mod tools"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
byteorder = "1.5"
memmap2 = "0.9"
walkdir = "2.4"
chrono = "0.4"
colored = "2.1"
indicatif = "0.17"
csv = "1.3"
t9-common = { path = "crates/t9-common" }

[profile.release]
opt-level = 3
lto = true
strip = true
