# No Weapon Rarities - String Patches for zm_common.ff
# These replace the rarity map variable names with dead names of the same length,
# so the GSC runtime can't find the rarity lookup tables. All weapons become default tier.

[[string_patches]]
description = "Neutralize weapon_rarity_map_list variable name"
search = "weapon_rarity_map_list"
replace = "weapon_rarity_map_noop"

[[string_patches]]
description = "Neutralize weapon_upgraded_rarity_map_list variable name"
search = "weapon_upgraded_rarity_map_list"
replace = "weapon_upgraded_rarity_map_noop"
